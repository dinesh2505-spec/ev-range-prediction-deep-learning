name: EV Range Prediction CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Required for Google Workload Identity Federation
permissions:
  contents: read
  id-token: write


env:

  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}

  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}


jobs:

  build-test-deploy:

    runs-on: ubuntu-latest


    steps:


      # -----------------------------------
      # Step 1: Checkout code
      # -----------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4



      # -----------------------------------
      # Step 2: Setup Python
      # -----------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      # -----------------------------------
      # Step 3: Install dependencies
      # -----------------------------------

      - name: Install dependencies
        run: |
          pip install -r requirements-docker.txt



      # -----------------------------------
      # Step 4: Run tests
      # -----------------------------------

      - name: Run pytest
        run: |
          pytest



      # -----------------------------------
      # Step 5: Authenticate Google Cloud
      # -----------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2

        with:

          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}



      # -----------------------------------
      # Step 6: Setup Google Cloud SDK
      # -----------------------------------

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2



      # -----------------------------------
      # Step 7: Configure Docker
      # -----------------------------------

      - name: Configure Docker authentication

        run: |

          gcloud auth configure-docker \
          ${{ env.REGION }}-docker.pkg.dev



      # -----------------------------------
      # Step 8: Build Docker Image
      # -----------------------------------

      - name: Build Docker image

        run: |

          docker build \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .



      # -----------------------------------
      # Step 9: Push Image to Artifact Registry
      # -----------------------------------

      - name: Push Docker image

        run: |

          docker push \
          ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}



      # -----------------------------------
      # Step 10: Deploy to Cloud Run
      # -----------------------------------

      - name: Deploy to Cloud Run

        run: |

          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --quiet